<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-mag-text="login.seitentitel">Lehrer Login</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <!-- CryptoJS für Verschlüsselung -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <script src="variante.js"></script>
    <script src="firebase-config.js"></script>
    <script src="texte.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 400px;
            width: 100%;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 28px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            text-align: center;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

            .form-group label {
                display: block;
                margin-bottom: 8px;
                font-weight: 600;
                color: #333;
            }

            .form-group input {
                width: 100%;
                padding: 12px;
                border: 2px solid #e0e0e0;
                border-radius: 8px;
                font-size: 14px;
                transition: border-color 0.3s;
            }

                .form-group input:focus {
                    outline: none;
                    border-color: #667eea;
                }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            background: #667eea;
            color: white;
            margin-bottom: 10px;
        }

            .btn:hover {
                background: #5568d3;
                transform: translateY(-2px);
            }

            .btn:disabled {
                background: #ccc;
                cursor: not-allowed;
                transform: none;
            }

        .btn-secondary {
            background: #f8f9fa;
            color: #667eea;
            border: 2px solid #667eea;
        }

            .btn-secondary:hover {
                background: #e9ecef;
            }

        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .divider {
            margin: 20px 0;
            text-align: center;
            color: #999;
            font-size: 14px;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

            .back-link a {
                color: #667eea;
                text-decoration: none;
                font-size: 14px;
            }

                .back-link a:hover {
                    text-decoration: underline;
                }

        #register-form {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 data-mag-text="login.titel">👨‍🏫 Lehrer-Login</h1>
        <p class="subtitle" data-mag-text="login.untertitel">Melden Sie sich an, um Termine zu verwalten</p>

        <div id="message"></div>

        <!-- Login Form -->
        <div id="login-form">
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>E-Mail</label>
                    <input type="email" id="login-email" name="email" autocomplete="username" required>
                </div>

                <div class="form-group">
                    <label>Passwort</label>
                    <input type="password" id="login-password" name="password" autocomplete="current-password" required>
                </div>

                <button type="submit" class="btn" id="login-btn">Anmelden</button>
            </form>

            <div class="back-link" style="margin-top: 12px;">
                <a href="#" onclick="passwortVergessen(event)">Passwort vergessen?</a>
            </div>

            <div class="divider" data-mag-ausblenden>oder</div>

            <button class="btn btn-secondary" onclick="showRegister()" data-mag-ausblenden>Neues Konto erstellen</button>
        </div>

        <!-- Register Form -->
        <div id="register-form">
            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>E-Mail</label>
                    <input type="email" id="register-email" name="email" autocomplete="username" required>
                </div>

                <div class="form-group">
                    <label>Passwort (min. 6 Zeichen)</label>
                    <input type="password" id="register-password" name="new-password" autocomplete="new-password" required minlength="6">
                </div>

                <div class="form-group">
                    <label>Name (optional)</label>
                    <input type="text" id="register-name" name="name" autocomplete="name" placeholder="Ihr Name">
                </div>

                <button type="submit" class="btn" id="register-btn">Konto erstellen</button>
            </form>

            <button class="btn btn-secondary" onclick="showLogin()">Zurück zum Login</button>
        </div>

        <div class="back-link">
            <a href="index.html">← Zurück zur Startseite</a>
        </div>
    </div>

    <p style="text-align: center; margin-top: 24px; font-size: 13px;">
        <a href="impressum.html" style="color: rgba(255, 255, 255, 0.85); text-decoration: none;">Impressum & Datenschutz</a>
    </p>

    <script>
        // Prüfe ob bereits eingeloggt
        window.onload = async () => {
            const user = await helpers.checkAuth();
            if (user) {
                window.location.href = 'lehrer-dashboard.html';
            }
        };

        function showMessage(text, type = 'info') {
            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML = `<div class="alert alert-${type}">${text}</div>`;

            if (type === 'success') {
                setTimeout(() => {
                    messageDiv.innerHTML = '';
                }, 3000);
            }
        }

        // Text für innerHTML entschärfen (Benutzereingaben in Meldungen)
        function htmlText(text) {
            return String(text).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        // Verständliche Meldung für Login-Fehler statt des englischen Firebase-Texts.
        // Falsches Passwort und unbekannte Adresse werden gleich behandelt (bei aktiver
        // E-Mail-Enumeration-Protection meldet Firebase ohnehin nur 'invalid-credential').
        function loginFehlerText(error) {
            switch (error && error.code) {
                case 'auth/wrong-password':
                case 'auth/user-not-found':
                case 'auth/invalid-credential':
                case 'auth/invalid-login-credentials':
                    return variantenText('login.fehler_zugangsdaten',
                        'E-Mail-Adresse oder Passwort ist falsch. Bitte prüfen Sie Ihre Eingabe. Haben Sie Ihr Passwort vergessen? Klicken Sie unten auf <strong>„Passwort vergessen?“</strong> - Sie erhalten dann einen Link, um ein neues Passwort zu setzen.');
                case 'auth/invalid-email':
                    return variantenText('login.vergessen_ungueltig', 'Bitte geben Sie eine gültige E-Mail-Adresse ein.');
                case 'auth/too-many-requests':
                    return variantenText('login.fehler_zu_viele',
                        'Zu viele fehlgeschlagene Anmeldeversuche. Bitte warten Sie einige Minuten oder setzen Sie Ihr Passwort über <strong>„Passwort vergessen?“</strong> zurück.');
                case 'auth/user-disabled':
                    return variantenText('login.fehler_gesperrt',
                        'Dieses Konto wurde deaktiviert. Bitte wenden Sie sich an die Betreiber des Tools (siehe Impressum).');
                case 'auth/network-request-failed':
                    return variantenText('login.fehler_netzwerk',
                        'Keine Verbindung zum Server. Bitte prüfen Sie Ihre Internetverbindung und versuchen Sie es erneut.');
                default:
                    return 'Fehler beim Login: ' + htmlText(error && error.message ? error.message : error);
            }
        }

        // Rücksetz-Link über Firebase anfordern. Ob ein Konto existiert, wird bewusst nicht
        // verraten (gleiche Meldung) - sonst liesse sich ausprobieren, welche Adressen ein Konto haben.
        async function passwortVergessen(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();

            if (!email) {
                showMessage(variantenText('login.vergessen_email_fehlt', 'Bitte geben Sie oben Ihre E-Mail-Adresse ein und klicken Sie dann nochmals auf „Passwort vergessen?“.'), 'info');
                document.getElementById('login-email').focus();
                return;
            }

            try {
                await auth.sendPasswordResetEmail(email);
            } catch (error) {
                if (error.code === 'auth/invalid-email') {
                    showMessage(variantenText('login.vergessen_ungueltig', 'Bitte geben Sie eine gültige E-Mail-Adresse ein.'), 'error');
                    return;
                }
                if (error.code === 'auth/too-many-requests') {
                    showMessage(variantenText('login.vergessen_zu_viele', 'Es wurden zu viele Links angefordert. Bitte versuchen Sie es in einigen Minuten erneut.'), 'error');
                    return;
                }
                if (error.code !== 'auth/user-not-found') {
                    showMessage('Fehler: ' + htmlText(error.message), 'error');
                    return;
                }
                // auth/user-not-found: gleiche Meldung wie bei Erfolg (siehe oben)
            }

            showMessage(variantenText('login.vergessen_gesendet',
                `Falls ein Konto mit <strong>${htmlText(email)}</strong> existiert, haben wir Ihnen einen Link zum Zurücksetzen des Passworts geschickt. Bitte prüfen Sie auch den Spam-Ordner.<br><br>Der Link ist eine Stunde gültig und funktioniert nur einmal. Haben Sie mehrere Links angefordert, gilt nur der <strong>neueste</strong>.`,
                htmlText(email)), 'info');
        }

        function showRegister() {
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('register-form').style.display = 'block';
            document.getElementById('message').innerHTML = '';
        }

        function showLogin() {
            document.getElementById('login-form').style.display = 'block';
            document.getElementById('register-form').style.display = 'none';
            document.getElementById('message').innerHTML = '';
        }

        async function handleLogin(e) {
            e.preventDefault();

            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const btn = document.getElementById('login-btn');

            btn.disabled = true;
            btn.textContent = 'Wird angemeldet...';

            try {
                const userCredential = await auth.signInWithEmailAndPassword(email, password);

                // Encryption Key generieren falls noch nicht vorhanden (für bestehende Accounts)
                await crypto.getOrCreateEncryptionKey(userCredential.user.uid);

                showMessage(variantenText('login.erfolg', '✓ Erfolgreich angemeldet! Sie werden weitergeleitet...'), 'success');

                setTimeout(() => {
                    window.location.href = 'lehrer-dashboard.html';
                }, 1000);

            } catch (error) {
                showMessage(loginFehlerText(error), 'error');
                btn.disabled = false;
                btn.textContent = 'Anmelden';
            }
        }

        async function handleRegister(e) {
            e.preventDefault();

            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;
            const name = document.getElementById('register-name').value;
            const btn = document.getElementById('register-btn');

            btn.disabled = true;
            btn.textContent = 'Konto wird erstellt...';

            try {
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);

                // Optional: Name als Display Name setzen
                if (name) {
                    await userCredential.user.updateProfile({
                        displayName: name
                    });
                }

                // Encryption Key generieren
                await crypto.getOrCreateEncryptionKey(userCredential.user.uid);

                // Settings initialisieren mit Lehrperson-Name
                await db.collection('settings').doc(userCredential.user.uid).set({
                    teacher_name: name || null,
                    min_termine_anzahl: 3,
                    standard_dauer_minuten: 30,
                    auto_email_enabled: false,
                    kontakt_email: null,
                    updated_at: firebase.firestore.FieldValue.serverTimestamp()
                });

                // Bestätigungslink senden (wird für die Nutzung des Tools vorausgesetzt).
                // Ein Fehler hier soll die Registrierung nicht scheitern lassen - im Dashboard
                // kann der Link jederzeit erneut angefordert werden.
                try {
                    await userCredential.user.sendEmailVerification();
                    // Sofort zum Login wechseln und den Hinweis dort stehen lassen (showLogin leert #message)
                    showLogin();
                    showMessage(`✓ Konto erfolgreich erstellt! Wir haben Ihnen einen Bestätigungslink an <strong>${email}</strong> geschickt. Bitte klicken Sie darauf und melden Sie sich danach an.`, 'info');
                } catch (verifyError) {
                    console.error('Bestätigungslink konnte nicht gesendet werden:', verifyError);
                    showMessage('✓ Konto erfolgreich erstellt! Sie können sich jetzt anmelden. Den Bestätigungslink können Sie im Dashboard anfordern.', 'success');
                    setTimeout(() => {
                        showLogin();
                    }, 2000);
                }

            } catch (error) {
                btn.disabled = false;
                btn.textContent = 'Konto erstellen';

                if (error.code === 'auth/email-already-in-use') {
                    // Häufigster Fall: Lehrperson hat das Passwort vergessen und versucht,
                    // sich neu zu registrieren. Zum Login wechseln und Adresse übernehmen.
                    showLogin();
                    document.getElementById('login-email').value = email;
                    document.getElementById('login-password').focus();
                    showMessage(`Mit <strong>${htmlText(email)}</strong> besteht bereits ein Konto - Ihre Daten sind noch vorhanden. Bitte melden Sie sich an. Falls Sie Ihr Passwort nicht mehr wissen, klicken Sie auf <strong>„Passwort vergessen?“</strong>.`, 'info');
                    return;
                }
                if (error.code === 'auth/weak-password') {
                    showMessage('Das Passwort ist zu schwach. Bitte wählen Sie mindestens 6 Zeichen.', 'error');
                    return;
                }
                if (error.code === 'auth/invalid-email') {
                    showMessage('Bitte geben Sie eine gültige E-Mail-Adresse ein.', 'error');
                    return;
                }
                showMessage('Fehler bei der Registrierung: ' + htmlText(error.message), 'error');
            }
        }
    </script>
</body>
</html>
